name: release

# Publishes to nuget.org via Trusted Publishing (OIDC) — no stored API key.
# The nuget.org policy is bound to this file's name; renaming it breaks publishing.

# One trigger, deliberately. This workflow now creates the tag itself (see the last
# step), so a `push: tags: ['v*']` trigger would make every release fire a second,
# duplicate run of itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.2'
        required: true

jobs:
  publish:
    # windows-latest so the SQL Server suite runs against LocalDB before anything ships.
    runs-on: windows-latest
    permissions:
      id-token: write   # required: lets GitHub mint the OIDC token nuget.org exchanges for a key
      contents: write   # required: the tag and GitHub Release created at the end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="${{ inputs.version }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing version $v"

      - run: dotnet build DbSignal.sln -c Release -p:Version=${{ steps.ver.outputs.version }}

      # Never publish something the conformance suite has not passed.
      - run: dotnet test DbSignal.sln -c Release --no-build

      - run: dotnet pack DbSignal.sln -c Release --no-build -o ./artifacts -p:Version=${{ steps.ver.outputs.version }}

      # Ask for the key immediately before pushing — it is only valid for 1 hour.
      - name: NuGet login (OIDC to short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push one at a time: dotnet's own globbing does not resolve on Windows, and a
      # quoted wildcard reaches it as a literal. Each .snupkg goes up with its .nupkg.
      - name: Push packages
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./artifacts/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No packages found in ./artifacts — nothing to publish."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # Tag and release LAST, only once nuget.org has accepted every package.
      #
      # This step exists because it did not, and 1.0.0, 1.0.1 and 1.0.2 all shipped to
      # nuget.org with no git tag and no GitHub Release behind them. Nothing failed. The
      # repository simply looked abandoned at v0.2.0 to anyone who visited it, and every
      # `compare/v1.0.1...v1.0.2` link in the CHANGELOG pointed at a tag that did not exist.
      - name: Tag and publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — leaving it alone."
            exit 0
          fi

          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

          # The CHANGELOG section for this version, if there is one. Release notes that
          # duplicate the changelog by hand drift from it; extracting means they cannot.
          notes=$(awk -v h="## [$VERSION]" '
            index($0, h) == 1        { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found                    { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="Published to nuget.org. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          fi

          echo "$notes" > release-notes.md
          gh release create "v$VERSION" --title "$VERSION" --notes-file release-notes.md --latest
