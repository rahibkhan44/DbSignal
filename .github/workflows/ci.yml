name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # windows-latest ships LocalDB, so the SQL Server conformance suite runs for real.
    # PostgreSQL skips visibly here — its container needs Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build DbSignal.sln -c Release
      - run: dotnet test DbSignal.sln -c Release --no-build --logger "console;verbosity=normal"

  postgres:
    # A second job rather than a change to the first: SQL Server needs Windows, PostgreSQL
    # needs a Linux container. Between the two, every provider runs against a real server
    # somewhere, and each skip is visible in the log rather than silent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Started by hand rather than as a `services:` container. The stock image ships
      # wal_level=replica, which cannot be changed at runtime, and `services:` has no
      # supported way to override a container's command — so a service container would
      # start a server the provisioner correctly refuses to use, on every single test.
      - name: Start PostgreSQL with logical replication
        run: |
          docker run -d --name dbsignal-postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:17 \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10

          for i in $(seq 1 30); do
            if docker exec dbsignal-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done

          echo "PostgreSQL did not become ready" >&2
          docker logs dbsignal-postgres
          exit 1

      - name: Verify wal_level
        run: |
          level=$(docker exec dbsignal-postgres psql -U postgres -tAc "SHOW wal_level;")
          echo "wal_level=$level"
          # Without this the whole job would pass by skipping, which is exactly the
          # failure mode the skip mechanism exists to make visible.
          [ "$level" = "logical" ] || { echo "wal_level must be logical" >&2; exit 1; }

      - run: dotnet build DbSignal.sln -c Release
      - run: dotnet test DbSignal.sln -c Release --no-build --logger "console;verbosity=normal"
        env:
          DBSIGNAL_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
